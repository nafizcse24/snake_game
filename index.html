<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#afd746">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="800"></canvas>

        <!-- On-screen directional buttons for mobile devices -->
        <div id="dpad">
            <button id="btn-up" aria-label="Up">▲</button>
            <div id="dpad-middle">
                <button id="btn-left" aria-label="Left">◀</button>
                <button id="btn-right" aria-label="Right">▶</button>
            </div>
            <button id="btn-down" aria-label="Down">▼</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
